<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212125;--ink:#ececea;--mute:#9a9a94;--line:#34343a;--acc:#5fc388;--blk:#55555c}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.sub a{color:var(--acc)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
h2{font-size:15px;margin:22px 0 8px;display:flex;justify-content:space-between;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;user-select:none}
.card.done{border-color:var(--acc);opacity:.62}
.card svg{flex:none;width:84px;height:84px}
.info{min-width:0;flex:1}
.alg{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;word-break:break-word}
.chk{flex:none;width:22px;height:22px;accent-color:var(--acc)}
.hide .card.done,.hide h2.alldone,.hide .grid.alldone{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:15px}
.mute{color:var(--mute);font-size:13px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;padding:6px;user-select:none}
.fcard svg{width:190px;height:190px}
.fcalg{min-height:48px;text-align:center;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-word}
.fcalg.hint{color:var(--mute);font:13px system-ui,sans-serif}
.fbtn{display:flex;justify-content:center;gap:8px;margin-top:6px}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px}.stat b{font-size:22px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.chip{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);text-align:center;width:84px}
.chip svg{width:60px;height:60px}
.sbtn{font-size:12px;padding:2px 8px;margin-top:6px}
.su{margin-top:6px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);word-break:break-word}

 for(let i=0;i<3;i++){r+=rc(o+i*c,1,c,o-3,s[9+i])+rc(o+c*3+2,o+i*c,o-3,c,s[12+i])+rc(o+i*c,o+c*3+2,c,o-3,s[15+i])+rc(1,o+i*c,o-3,c,s[18+i])}
 return r+'</svg>'}
function pllSvg(s){let r='<svg viewBox="0 0 76 76" aria-hidden="true">',c=18,o=11;
 for(let i=0;i<9;i++)r+=RC(o+(i%3)*c,o+Math.floor(i/3)*c,c,c,"Y");
 for(let i=0;i<3;i++)r+=RC(o+i*c,2,c,8,s[i])+RC(o+54,o+i*c,8,c,s[3+i])+RC(o+i*c,o+54,c,8,s[6+i])+RC(2,o+i*c,8,c,s[9+i]);
 return r+'</svg>'}
function f2lSvg(s){let r='<svg viewBox="0 0 80 80" aria-hidden="true">',c=12,g=2;
 const face=(ox,oy,o)=>{for(let i=0;i<9;i++)r+=RC(ox+(i%3)*c,oy+Math.floor(i/3)*c,c,c,s[o+i])};
 face(4,4,0);face(4,4+3*c+g,9);face(4+3*c+g,4+3*c+g,18);return r+'</svg>'}
function mkTab(c){
  const root=document.getElementById(c.id);
  let done=ld(c.key+"-learned-v1",{}),st=ld(c.key+"-stats-v1",{});
  const byId={};let n=0,cur=null,shown=false,counted=false;
  root.innerHTML='<div class="bar"><div class="row"><b class="cnt"></b><span><button class="hb">Hide learned</button> <button class="rb">Reset</button></span></div><div class="prog"><i class="pb"></i></div></div><div class="panel"><h3>Flashcards</h3><div class="fc"></div></div><div class="panel"><h3>Recall tracker</h3><div class="trk"></div></div><h2><span>Checklist</span></h2><div class="app"></div>';
  const q=s=>root.querySelector(s),app=q(".app"),saveD=()=>sv(c.key+"-learned-v1",done),saveS=()=>sv(c.key+"-stats-v1",st);
  c.data.forEach(([g,cs],gi)=>{
    const h=document.createElement("h2");h.innerHTML="<span></span><span class='gc'></span>";h.firstChild.textContent=g;app.appendChild(h);
    const gr=document.createElement("div");gr.className="grid";
    cs.forEach(([lb,a,s],ci)=>{
      n++;const id=gi+"-"+ci;byId[id]=[a,s,g,lb];
      const el=document.createElement("label");el.className="card";el.dataset.id=id;
      el.innerHTML=c.svg(s)+'<div class="info"><b class="lb"></b><div class="alg"></div></div><input type="checkbox" class="chk">';
      el.querySelector(".lb").textContent=lb;el.querySelector(".alg").textContent=a;if(!lb)el.querySelector(".lb").remove();
      const inf=el.querySelector(".info"),sb=document.createElement("button"),sd=document.createElement("div");
      sb.type="button";sb.className="sbtn";sb.textContent="Show setup";sd.className="su";sd.hidden=true;sd.textContent=inv(a);
      sb.onclick=e=>{e.preventDefault();e.stopPropagation();sd.hidden=!sd.hidden;sb.textContent=sd.hidden?"Show setup":"Hide setup"};
      inf.appendChild(sb);inf.appendChild(sd);
      const cb=el.querySelector("input");cb.onchange=()=>{if(cb.checked)done[id]=1;else delete done[id];saveD();upd()};
      gr.appendChild(el)});
    app.appendChild(gr)});
  const pool=()=>Object.keys(done).filter(i=>byId[i]);
  function draw(){
    const p=pool();if(!p.length){cur=null;return}
    const cc=p.length>1?p.filter(i=>i!==cur):p,w=cc.map(i=>st[i]&&st[i].l?3:1),tot=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot,k=0;while(k<w.length-1&&r>=w[k]){r-=w[k];k++}
    cur=cc[k];shown=false;counted=false;const s=st[cur]=st[cur]||{s:0,c:0,l:0};s.s++;s.l=0;saveS()}
  function renderFc(){
    const f=q(".fc");if(!cur||!done[cur])draw();
    if(!cur){f.innerHTML='<div class="mute">Tick some cases in the checklist below. Flashcards are drawn only from cases you marked as learned.</div>';return}
    f.innerHTML='<div class="fcard" role="button" tabindex="0">'+c.svg(byId[cur][1])+'<div class="fcalg"></div></div><div class="su" hidden style="text-align:center"></div><div class="fbtn"><button class="sb">Show setup</button><button class="nx">Next case</button></div>';
    const box=f.querySelector(".fcard"),al=f.querySelector(".fcalg"),sd=f.querySelector(".su"),sb=f.querySelector(".sb");let arm=0;
    function paint(){if(shown){al.className="fcalg";al.textContent=byId[cur][0]}else{al.className="fcalg hint";al.textContent="Tap the case twice to show the alg"}}
    function tog(){
      if(!shown&&!arm){arm=setTimeout(()=>{arm=0;paint()},3000);al.className="fcalg hint";al.textContent="Tap again to show the alg";return}
      if(arm){clearTimeout(arm);arm=0}
      shown=!shown;
      if(shown&&!counted){counted=true;const s=st[cur];s.c++;s.l=1;saveS();renderTrk()}
      paint()}
    box.onclick=tog;box.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}};
    f.querySelector(".nx").onclick=()=>{draw();renderFc();renderTrk()};
    sd.textContent=inv(byId[cur][0]);sb.onclick=()=>{sd.hidden=!sd.hidden;sb.textContent=sd.hidden?"Show setup":"Hide setup"};
    paint()}
  function chip(i){const d=document.createElement("div");d.className="chip";d.title=byId[i][2];d.innerHTML=c.svg(byId[i][1])+"<span></span>";d.lastChild.textContent=st[i].s+" seen, "+st[i].c+" checked";return d}
  function renderTrk(){
    const t=q(".trk"),ids=Object.keys(st).filter(i=>byId[i]);let tc=0,seen=0;const ok=[],bad=[];
    ids.forEach(i=>{const s=st[i];tc+=s.c;seen+=s.s;(s.l?bad:ok).push(i)});
    t.innerHTML='<div class="stat"><div><b>'+tc+'</b><span class="mute">times checked the alg</span></div><div><b>'+seen+'</b><span class="mute">cards seen</span></div><div><b>'+ok.length+'</b><span class="mute">cases with no check needed</span></div></div><div class="mute">No check needed (last time you saw them)</div><div class="chips okc"></div><div class="mute">Still checking</div><div class="chips badc"></div><button class="rs">Reset recall stats</button>';
    const oc=t.querySelector(".okc"),bc=t.querySelector(".badc");
    ok.forEach(i=>oc.appendChild(chip(i)));bad.forEach(i=>bc.appendChild(chip(i)));
    if(!ok.length)oc.innerHTML='<span class="mute">None yet</span>';if(!bad.length)bc.innerHTML='<span class="mute">None yet</span>';
    const b=t.querySelector(".rs");let z=0;
    b.onclick=()=>{if(!z){b.textContent="Tap again to confirm";z=setTimeout(()=>{z=0;b.textContent="Reset recall stats"},3000);return}clearTimeout(z);st={};saveS();cur=null;renderFc();renderTrk()}}
  function updList(){let t=0;
    root.querySelectorAll(".card").forEach(e=>{const d=!!done[e.dataset.id];e.classList.toggle("done",d);e.querySelector("input").checked=d;if(d)t++});
    root.querySelectorAll(".grid").forEach(gr=>{const cards=gr.querySelectorAll(".card"),dn=gr.querySelectorAll(".card.done").length,h=gr.previousElementSibling,all=dn===cards.length;gr.classList.toggle("alldone",all);h.classList.toggle("alldone",all);h.querySelector(".gc").textContent=dn+"/"+cards.length});
    q(".cnt").textContent=t+" / "+n+" learned";q(".pb").style.width=(t/n*100)+"%"}
  function upd(){updList();renderFc();renderTrk()}
  q(".hb").onclick=function(){const h=root.classList.toggle("hide");this.textContent=h?"Show learned":"Hide learned"};
  (function(){const b=q(".rb");let t=0;b.onclick=()=>{if(!t){b.textContent="Tap again to confirm";t=setTimeout(()=>{t=0;b.textContent="Reset"},3000);return}clearTimeout(t);t=0;b.textContent="Reset";done={};saveD();upd()}})();
  upd()}
mkTab({id:"oll",key:"oll",data:DATA.oll,svg:ollSvg});
mkTab({id:"pll",key:"pll",data:DATA.pll,svg:pllSvg});
mkTab({id:"f2l",key:"f2l",data:DATA.f2l,svg:f2lSvg});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));window.scrollTo(0,0)});

/* timer */
const S=ld("tm-set",{insp:"0",hold:"300",upd:"live",dec:"2",fs:72,acc:"#2f7d4f"});let SS={cur:0,l:[{n:"Session 1",t:[]}]};
try{const o=JSON.parse(localStorage.getItem("tm-ses")||"null");if(o&&o.l&&o.l.length&&o.l[o.cur])SS=o;else SS.l[0].t=JSON.parse(localStorage.getItem("tm-times")||"[]")}catch(e){}
let times=SS.l[SS.cur].t;
const $=id=>document.getElementById(id);
function applyS(){$("sI").value=S.insp;$("sH").value=S.hold;$("sU").value=S.upd;$("sD").value=S.dec;$("sF").value=S.fs;$("sC").value=S.acc;
 $("td").style.fontSize=S.fs+"px";document.documentElement.style.setProperty("--acc",S.acc)}
[["sI","insp"],["sH","hold"],["sU","upd"],["sD","dec"],["sF","fs"],["sC","acc"]].forEach(([id,k])=>$(id).oninput=()=>{S[k]=$(id).value;sv("tm-set",S);applyS();show(0)});
function fmt(ms){if(ms===Infinity)return"DNF";const d=+S.dec,s=ms/1000,m=Math.floor(s/60);const x=(s-m*60).toFixed(d);return m?m+":"+(x.length<d+3?"0":"")+x:x}
function val(t){return t.p<0?Infinity:t.t+(t.p>0?2000:0)}
function ao(n){if(times.length<n)return"-";const v=times.slice(-n).map(val).sort((a,b)=>a-b);if(v.filter(x=>x===Infinity).length>1)return"DNF";const m=v.slice(1,-1);return fmt(m.reduce((a,b)=>a+b,0)/m.length)}
function stats(){const v=times.map(val),b=v.length?Math.min(...v):0;
 $("stats").innerHTML="<div><b>"+(v.length?fmt(v[v.length-1]):"-")+"</b><span class=mute>last</span></div><div><b>"+(v.length?fmt(b):"-")+"</b><span class=mute>best</span></div><div><b>"+ao(5)+"</b><span class=mute>ao5</span></div><div><b>"+ao(12)+"</b><span class=mute>ao12</span></div><div><b>"+v.length+"</b><span class=mute>solves</span></div>";
 $("tl").textContent=times.map((t,i)=>(i+1)+".  "+fmt(val(t))+(t.p>0?" (+2)":"")).reverse().join("\n");$("tl").style.whiteSpace="pre";sv("tm-ses",SS);delta();sesUI()}
function delta(){const n=times.length,d=$("dv");if(n<2){d.textContent="";return}const a=val(times[n-1]),b=val(times[n-2]);if(a===Infinity||b===Infinity){d.textContent="";return}const x=a-b;d.textContent=(x<0?"\u2212":x>0?"+":"")+(Math.abs(x)/1000).toFixed(+S.dec)+" vs last";d.style.color=x<0?"#2fa84f":x>0?"#d93a2f":""}
function scr(){const ax=[["R","L"],["U","D"],["F","B"]],m=["","'","2"];let o=[],last=-1;while(o.length<20){const a=Math.floor(Math.random()*3);if(a===last)continue;last=a;o.push(ax[a][Math.floor(Math.random()*2)]+m[Math.floor(Math.random()*3)])}$("scr").textContent=o.join(" ")}
let st="idle",t0=0,raf=0,ht=0,ready=false,inT=0,ip=0,tp=0;
function show(ms){let tx=fmt(ms);if(st==="run"&&S.upd==="hide")tx="Solving";else if(st==="run"&&S.upd==="stop")tx="...";$("td").textContent=tx}
function msg(t){$("ts").textContent=t}
function tick(){const e=performance.now()-t0;if(S.upd==="live")show(e);else show(e);raf=requestAnimationFrame(tick)}
function inspTick(){const s=(performance.now()-inT)/1000;ip=s>17?-1:s>15?2:0;$("td").textContent=s>17?"DNF":s>15?"+2":String(Math.max(0,Math.ceil(15-s)));raf=requestAnimationFrame(inspTick)}
function down(){if(st==="run"){cancelAnimationFrame(raf);const e=performance.now()-t0;times.push({t:Math.round(e),p:tp});st="stopped";$("td").textContent=fmt(e+(tp>0?2000:0));msg("Stopped");stats();scr();return}
 if(st==="stopped")return;ready=false;$("td").style.color="#d93a2f";const w=+S.hold;ht=setTimeout(()=>{ready=true;$("td").style.color="#2fa84f"},w);if(!w){ready=true;$("td").style.color="#2fa84f"}}
function up(){if(st==="stopped"){st="idle";$("td").style.color="";return}
 clearTimeout(ht);$("td").style.color="";
 if(st==="idle"&&S.insp==="1"){if(ready){st="insp";inT=performance.now();ip=0;inspTick();msg("Inspecting. Hold again, release to start")}return}
 if(ready&&(st==="idle"||st==="insp")){cancelAnimationFrame(raf);tp=st==="insp"?ip:0;st="run";$("dv").textContent="";t0=performance.now();tick();msg("Solving, touch or press space to stop")}}
$("tm").addEventListener("pointerdown",e=>{e.preventDefault();down()});$("tm").addEventListener("pointerup",e=>{e.preventDefault();up()});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&$("tim").classList.contains("on")){e.preventDefault();if(!e.repeat)down()}});
document.addEventListener("keyup",e=>{if(e.code==="Space"&&$("tim").classList.contains("on")){e.preventDefault();up()}});
$("nsc").onclick=scr;$("p2").onclick=()=>{const t=times[times.length-1];if(t){t.p=t.p===2?0:2;stats()}};$("pd").onclick=()=>{const t=times[times.length-1];if(t){t.p=t.p<0?0:-1;stats()}};
$("dl").onclick=()=>{times.pop();stats()};let cf=0;$("cl").onclick=()=>{if(!cf){$("cl").textContent="Tap again to confirm";cf=setTimeout(()=>{cf=0;$("cl").textContent="Clear session"},3000);return}clearTimeout(cf);cf=0;$("cl").textContent="Clear session";times.length=0;stats()};
function sesUI(){const s=$("ss");s.innerHTML="";SS.l.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=x.n+" ("+x.t.length+")";s.appendChild(o)});s.value=SS.cur}
$("ss").onchange=()=>{SS.cur=+$("ss").value;times=SS.l[SS.cur].t;stats()};
$("ns").onclick=()=>{SS.l.push({n:"Session "+(SS.l.length+1),t:[]});SS.cur=SS.l.length-1;times=SS.l[SS.cur].t;sesUI();stats()};
applyS();sesUI();scr();stats();show(0);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script></body></html>
